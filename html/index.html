<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/felles.css">
    <link rel="stylesheet" href="../css/nav.css">
    <link rel="stylesheet" href="../css/hero-page.css">
    <link rel="stylesheet" href="../css/solutions.css">
    <link rel="stylesheet" href="../css/faq.css">
    <link rel="stylesheet" href="../css/footer.css">
    <title>Bolig i Bergen</title>
</head>
<body>
    <main>
        <section class="nav-section">
            <nav>
                <div class="logo-container">
                    <a href="index.html" class="nav-btn"><strong>BiB</strong></a>
                </div>
                <div class="btn-container">
                    <a href="index.html" class="nav-btn active">Hjem</a>
                    <a href="#" class="nav-btn">Kontakt oss</a>
                    <a href="om-oss.html" class="nav-btn">Om oss</a>
                    <a href="#" class="nav-btn">Prosjekt</a>
                </div>
            </nav>
            <div class="shadow-layer"></div>
        </section>
        <section class="hero stats front-page">
            <div class="hero-container"></div>
            <div class="stats-container">
                <div class="BergenBilde-container">
                    <img class="map-img" src="../images/BergenHalvoyBilde.png" alt="bilde av bergen halvsoya">
                </div>
            </div>
        </section>
        <section class="løsning"></section>
        <section class="faq"></section>
    
    </main>


       

<footer class="footer-kontakt-oss">


    <div class="kontakt-container">
    <div class="spørsmål">
        <h1>Spørsmål om boligprisene?</h1>
        <h2>Send oss en melding</h2>
    </div>

    <form class="kontakt-skjema">
        <label for="navn">Navn</label>
        <input
            type="text"
            id="navn"
            name="navn"
            placeholder="Skriv inn navn"
            required
    >
    
        <label for="email">E-post</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Skriv inn e-post"
            required
        >

        <label for="melding">Spørsmål</label>
        <textarea
            id="melding"
            name="melding"
            placeholder="Skriv inn spørsmål"
            rows="5"
            required
        ></textarea>

        <button type="submit">Send melding</button>
    </form>
    </div>

    <div class="footer-bunn">
        <div class="sosiale-medier">
            <a href="https://instagram.com">@BoligIBergen</a>
            <a href="https://github.com">Sjekk ut vår GitHub</a>
            <a href="https://linkedin.com">Sjekk ut vår LinkedIn</a>
        </div>

        <p class="copyright">
            &copy; 2026 Bolig I Bergen A/S. All rights reserved.
        </p>
    </div>
</footer>


</body>
</html>
